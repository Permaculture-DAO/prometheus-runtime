name: RAVEL CI

on:
  pull_request:
    paths:
      - "services/api/app/ravel.py"
      - "services/api/app/ravel_schemas.py"
      - "services/api/app/main.py"
      - "services/api/tests/test_ravel.py"
      - "config/ravel_profile.json"
      - "scripts/validate_runtime.py"
      - ".github/workflows/ravel-ci.yml"
  push:
    branches:
      - "feature/ravel-v2-2026-10-05"

jobs:
  ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.lock pytest pyyaml
      - name: Run RAVEL unit tests
        env:
          PYTHONPATH: services/api
        run: pytest -q services/api/tests/test_ravel.py
      - name: Validate runtime boundaries
        run: python scripts/validate_runtime.py
