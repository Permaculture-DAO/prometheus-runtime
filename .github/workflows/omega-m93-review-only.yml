name: Omega M9.3 review-only security checks
on:
  pull_request:
    paths:
      - 'experiments/omega_btrl/m93/**'
      - '.github/workflows/omega-m93-review-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  omega-m93-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'experiments/omega_btrl/m93/requirements-lab.txt'
      - name: Install pinned laboratory dependencies (not production-approved)
        run: python -m pip install -r experiments/omega_btrl/m93/requirements-lab.txt
      - name: M6 content provenance (Git blob and SHA-256)
        run: python experiments/omega_btrl/m93/scripts_m93/verify_m6_source.py
      - name: Run M9.3 and M6 tests (no intentional skips)
        working-directory: experiments/omega_btrl
        env:
          PYTHONPATH: '.:m93'
        run: |
          python -m pytest m93/tests_m93 m93/tests_m92 m93/tests -q -o addopts=''
          python -m pytest tests -q -o addopts=''
      - name: Exercise local ephemeral mTLS (no external service)
        working-directory: experiments/omega_btrl
        env:
          PYTHONPATH: '.:m93'
        run: python m93/scripts_m92/loopback_mtls_multiworker.py
      - name: Native S4-S6 baseline guards
        run: |
          python scripts/s4_guard.py
          python scripts/s5_guard.py
          python scripts/s6_guard.py
      - name: Verify default-off API boundaries
        run: |
          python - <<'PYCHECK'
          from pathlib import Path
          main=Path('services/api/app/main.py').read_text()
          assert 'gateway_m92' not in main
          assert 'omega_btrl' not in main
          app=Path('experiments/omega_btrl/m93/gateway_m92/secure.py').read_text()
          assert 'app = create_m92_gateway()' in app
          print('OMEGA_M93_NATIVE_BOUNDARIES_UNMODIFIED_PASS')
          PYCHECK
      - name: Verify bounded 37-addition + single CI-workflow compatibility delta
        if: github.event_name == 'pull_request'
        run: python experiments/omega_btrl/m93/scripts_m93/check_review_delta.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Block unsigned head for merging (verified-commit check)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const r = await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:sha});
            const verification = r.data.commit.verification;
            if (!verification?.verified) core.setFailed(`Commit is not verified: ${verification?.reason ?? 'unknown'}`);
            else core.info('M93_HEAD_COMMIT_VERIFIED');
